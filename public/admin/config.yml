# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.237.0/schema/sveltia-cms.json
# Panel de contenido de Subtrama (Sveltia CMS).
# Backend GitHub. Inicio de sesión con token personal (Contents y Pull requests, lectura y escritura).
# Cada guardado se publica mediante flujo editorial: crea un pull request para revisar y fusionar.
backend:
  name: github
  repo: noxit0/subtrama
  branch: main

publish_mode: editorial_workflow

# Carpeta de medios. public/ se sirve en la raíz del sitio, por eso la URL pública es /media.
media_folder: public/media
public_folder: /media

locale: es

collections:
  - name: servicios
    label: Servicios
    label_singular: Servicio
    description: Contenido de cada servicio. El orden controla la posición en el sitio.
    folder: src/content/servicios
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: titulo
    summary: "{{fields.orden}}. {{titulo}}"
    sortable_fields: [orden, titulo]
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: etiqueta, label: Etiqueta, widget: string, hint: "Nombre corto que aparece en las tarjetas" }
      - { name: orden, label: Orden, widget: number, value_type: int, min: 1, step: 1 }
      - name: etapa
        label: Etapa del proceso
        widget: select
        hint: "Agrupa el servicio en la página de Servicios"
        options:
          - { label: Diagnóstico, value: diagnostico }
          - { label: Producción, value: produccion }
          - { label: Gestión, value: gestion }
      - { name: resumen, label: Resumen, widget: string, hint: "Una línea que describe el servicio" }
      - { name: intro, label: Introducción, widget: text }
      - { name: entrega, label: Qué recibís, widget: text }
      - name: incluye
        label: Qué incluye
        label_singular: Ítem
        widget: list
        summary: "{{fields.lead}}"
        fields:
          - { name: lead, label: Título del ítem, widget: string }
          - { name: text, label: Detalle, widget: string }

  - name: paquetes
    label: Paquetes
    label_singular: Paquete
    description: Paquetes comerciales. Los precios no se publican: se informan en la propuesta.
    folder: src/content/paquetes
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: nombre
    summary: "{{fields.orden}}. {{nombre}}"
    sortable_fields: [orden, nombre]
    fields:
      - { name: nombre, label: Nombre, widget: string }
      - { name: orden, label: Orden, widget: number, value_type: int, min: 1, step: 1 }
      - name: tipo
        label: Tipo
        widget: select
        options:
          - { label: Cerrado, value: cerrado }
          - { label: A medida, value: personalizable }
      - { name: destacado, label: Recomendado, widget: boolean, default: false, required: false, hint: "Muestra la cinta Recomendado en la tarjeta" }
      - { name: dato_tarjeta, label: Dato de la tarjeta, widget: string, required: false, hint: "Ejemplo: 4 piezas por mes. Se muestra solo si el paquete no tiene grilla de piezas" }
      - name: grilla
        label: Grilla de piezas
        widget: object
        required: false
        hint: "Dibuja el mes en la tarjeta: un cuadrado por pieza de feed"
        fields:
          - { name: videos, label: Videos por mes, widget: number, value_type: int, min: 0, step: 1 }
          - { name: estaticas, label: Estáticas por mes, widget: number, value_type: int, min: 0, step: 1 }
          - { name: hasta, label: Máximo de piezas, widget: number, value_type: int, min: 1, step: 1, required: false, hint: "Solo paquetes a medida. Los cuadrados que faltan hasta el máximo se muestran punteados" }
      - { name: informe_meses, label: Informe cada (meses), widget: number, value_type: int, min: 1, step: 1, required: false, hint: "Solo paquetes cerrados. Dibuja la línea de tiempo de informes en la comparación de Servicios" }
      - { name: resumen, label: Resumen, widget: text }
      - { name: para_quien, label: Para quién es, widget: text }
      - name: detalle
        label: Detalle para la tabla comparativa
        widget: object
        required: false
        hint: "Solo paquetes cerrados"
        fields:
          - { name: piezas, label: Piezas de feed, widget: string }
          - { name: historias, label: Historias, widget: string }
          - { name: jornada, label: Jornada de registro, widget: string }
          - { name: informe, label: Informe y reunión, widget: string }
          - { name: calendarizacion, label: Calendarización, widget: string }
      - name: incluye
        label: Qué incluye
        label_singular: Ítem
        widget: list
        summary: "{{fields.lead}}"
        fields:
          - { name: lead, label: Título del ítem, widget: string }
          - { name: text, label: Detalle, widget: string }

  - name: marcas
    label: Marcas
    label_singular: Marca
    description: Marcas que se muestran en el inicio. Sin logo, se muestra el nombre en texto.
    folder: src/content/marcas
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: nombre
    summary: "{{fields.orden}}. {{nombre}}"
    sortable_fields: [orden, nombre]
    media_folder: src/assets/marcas
    public_folder: /src/assets/marcas
    fields:
      - { name: nombre, label: Nombre, widget: string }
      - { name: rubro, label: Rubro, widget: string }
      - { name: orden, label: Orden, widget: number, value_type: int, min: 1, step: 1 }
      - { name: visible, label: Mostrar en la web, widget: boolean, default: true }
      - { name: logo, label: Logo, widget: image, required: false, hint: "PNG o SVG con fondo transparente. Se optimiza solo al publicar." }
      - { name: url, label: Enlace (opcional), widget: string, required: false }

  - name: ajustes
    label: Condiciones
    files:
      - name: inicio
        label: Página de inicio (orden de secciones)
        file: src/content/ajustes/inicio.json
        format: json
        fields:
          - name: secciones
            label: Secciones, en orden de aparición
            label_singular: Sección
            widget: list
            hint: "Arrastrá para cambiar el orden. Quitá una sección para ocultarla. La portada y el cierre son fijos."
            summary: "{{fields.tipo}}"
            fields:
              - name: tipo
                label: Sección
                widget: select
                options:
                  - { label: Para quién trabajamos, value: para-quien }
                  - { label: Paquetes, value: paquetes }
                  - { label: Marcas con las que trabajamos, value: marcas }
                  - { label: Cómo se trabaja, value: como-se-trabaja }
      - name: whatsapp
        label: Botón de WhatsApp
        file: src/content/ajustes/whatsapp.json
        format: json
        fields:
          - { name: activo, label: Mostrar el botón flotante, widget: boolean, default: true }
          - { name: mensaje, label: Mensaje inicial, widget: string, hint: "Texto que ya aparece escrito cuando la persona abre el chat" }
      - name: proceso
        label: Cómo trabajamos (pasos del inicio)
        file: src/content/ajustes/proceso.json
        format: json
        fields:
          - name: pasos
            label: Pasos
            label_singular: Paso
            widget: list
            summary: "{{fields.titulo}}"
            hint: "Arrastrá para cambiar el orden. Se recomiendan 4 pasos."
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: text }
      - name: preguntas
        label: Preguntas frecuentes
        file: src/content/ajustes/preguntas.json
        format: json
        fields:
          - name: items
            label: Preguntas
            label_singular: Pregunta
            widget: list
            summary: "{{fields.pregunta}}"
            hint: "Sin preguntas, la sección no se muestra en Servicios."
            fields:
              - { name: pregunta, label: Pregunta, widget: string }
              - { name: respuesta, label: Respuesta, widget: text }
      - name: contacto
        label: Contacto (qué pasa después)
        file: src/content/ajustes/contacto.json
        format: json
        fields:
          - name: pasos_siguientes
            label: Pasos después de enviar la consulta
            label_singular: Paso
            widget: list
            summary: "{{fields.texto}}"
            fields:
              - { name: texto, label: Texto, widget: string }
      - name: condiciones
        label: Condiciones comerciales
        file: src/content/ajustes/condiciones.json
        format: json
        fields:
          - { name: plazo_minimo, label: Plazo mínimo de contratación, widget: string }
          - { name: ajuste, label: Ajuste del valor, widget: text }
          - name: condiciones
            label: Condiciones
            label_singular: Condición
            widget: list
            summary: "{{fields.texto}}"
            fields:
              - { name: texto, label: Texto, widget: text }
      - name: adicionales
        label: Adicionales
        file: src/content/ajustes/adicionales.json
        format: json
        fields:
          - name: items
            label: Adicionales
            label_singular: Adicional
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
